<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <radialGradient id="hBgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Cyan Electric Glow Gradient -->
    <linearGradient id="hCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <!-- Gold Cash Lightning Gradient -->
    <linearGradient id="hGoldGlow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="hShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left: Emblem Icon -->
  <g transform="translate(15, 15) scale(0.293)">
    <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#hBgGrad)" stroke="#4f46e5" stroke-width="6"/>
    <polygon points="256,60 410,140 410,372 256,452 102,372 102,140" fill="none" stroke="url(#hCyanGlow)" stroke-width="7" opacity="0.5" stroke-dasharray="16, 8"/>
    <polygon points="256,84 388,154 388,358 256,428 124,358 124,154" fill="url(#hShieldGrad)" stroke="#67e8f9" stroke-width="3" opacity="0.95"/>
    <polygon points="256,92 380,158 380,352 256,420 132,352 132,158" fill="#0b0f19" opacity="0.85"/>
    <path d="M 256 120 L 350 330 L 310 330 L 256 210 L 202 330 L 162 330 Z" fill="url(#hCyanGlow)"/>
    <path d="M 330 230 A 105 105 0 1 1 320 370 L 285 335 A 65 65 0 1 0 295 245 Z" fill="#818cf8" opacity="0.65"/>
    <polygon points="268,130 198,265 246,265 220,385 316,245 264,245" fill="url(#hGoldGlow)" filter="url(#hGlow)" stroke="#fff" stroke-width="2"/>
    <polygon points="256,236 261,250 275,256 261,262 256,276 251,262 237,256 251,250" fill="#ffffff"/>
  </g>

  <!-- Right: Typography Wordmark -->
  <!-- "AUTO" in Ultra-Bold Modern Sans -->
  <text x="180" y="104" font-family="'Noto Sans Arabic', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="74" fill="#0f172a" letter-spacing="2">AUTO</text>
  <!-- "CASH" in Vivid Amber-Gold -->
  <text x="408" y="104" font-family="'Noto Sans Arabic', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="74" fill="url(#hGoldGlow)" letter-spacing="2">CASH</text>

  <!-- Subtitle Tagline in Uyghur & English -->
  <text x="184" y="146" font-family="'Noto Sans Arabic', sans-serif" font-weight="700" font-size="18" fill="#4f46e5" letter-spacing="0.5">ئاپتوماتىك رەقەملىك مۇلازىمەت مەركىزى</text>
  <circle cx="505" cy="141" r="3" fill="#cbd5e1"/>
  <text x="518" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" fill="#64748b" letter-spacing="3">DIGITAL CASH</text>
</svg>
